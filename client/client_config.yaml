gateway:
  url: "http://MIDDLE_VPS_PUBLIC_IP:8080"
  username: proxy
  password: "${GATEWAY_PASSWORD}"
  verify_tls: true
  timeout_seconds: 30

selector:
  # rules: rotate only after configured block statuses
  # fixed_count: rotate after rotate_after logical requests
  # random: choose a random node for every logical request
  mode: rules
  rotate_after: 5
  max_attempts_on_403: 3
  block_statuses: [403, 418, 429]
