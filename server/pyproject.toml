[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proxy-pool"
version = "0.1.0"
description = "Synchronous proxy pool with direct proxies and installed GOST nodes"
requires-python = ">=3.11"
dependencies = [
  "paramiko>=3.4",
  "httpx[socks]>=0.27",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
